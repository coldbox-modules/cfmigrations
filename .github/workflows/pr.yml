name: PRs and Branches

on:
  push:
    branches-ignore:
      - "main"
      - "master"
      - "development"
  pull_request:
    branches:
      - main
      - master
      - development

jobs:
  tests:
    runs-on: ubuntu-latest
    name: Tests
    continue-on-error: ${{ matrix.experimental }}
    env:
      DB_DRIVER: postgresql
      DB_HOST: localhost
      DB_NAME: cfmigrations_testing
      DB_USER: cfmigrations_testing
      DB_PASSWORD: cfmigrations_testing
    strategy:
      fail-fast: false
      matrix:
        cfengine: [ "lucee@6", "lucee@7", "adobe@2023", "adobe@2025", "boxlang-cfml@1", "boxlang@1" ]
        experimental: [ false ]
        coldbox: [ "coldbox@8" ]
        include:
          - cfengine: "lucee@be"
            experimental: true
          - cfengine: "boxlang@be"
            experimental: true
          - cfengine: "boxlang-cfml@be"
            experimental: true
    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_USER: cfmigrations_testing
          POSTGRES_PASSWORD: cfmigrations_testing
          POSTGRES_DB: cfmigrations_testing
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup CommandBox CLI
        uses: Ortus-Solutions/setup-commandbox@v2.0.1
        with:
          installSystemModules: true
          install: commandbox-boxlang

      - name: Configure database port
        run: echo "DB_PORT=${{ job.services.postgres.ports[5432] }}" >> "$GITHUB_ENV"

      - name: Initial Server Start (so lex extensions are picked up)
        run: |
          box config set modules.commandbox-dotenv.checkEnvPreServerStart=false
          box server start serverConfigFile="server-${{ matrix.cfengine }}.json" --noSaveSettings --debug
          sleep 30

      - name: Install dependencies
        run: |
          box install --verbose
          box install ${{ matrix.coldbox }} --noSave

      - name: Restart server (so extensions are picked up)
        run: |
          box server restart serverConfigFile="server-${{ matrix.cfengine }}.json" --debug
          sleep 30

      - name: Run TestBox Tests
        run: box testbox run

  format:
    runs-on: ubuntu-latest
    name: Format
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Set Up CommandBox
        uses: Ortus-Solutions/setup-commandbox@v2.0.1

      - name: Install CFFormat
        run: box install commandbox-cfformat

      - name: Run CFFormat
        run: box run-script format

      - name: Commit Format Changes
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          commit_message: Apply cfformat changes